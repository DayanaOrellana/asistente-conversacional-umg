
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña | Asistente UMG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            background:
                linear-gradient(
                    rgba(9, 18, 35, 0.62),
                    rgba(9, 18, 35, 0.78)
                ),
                url("{{ url_for('static', filename='campus_jutiapa.webp') }}")
                center center / cover no-repeat fixed;
        }

        .pagina {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 480px;
            padding: 35px;

            background: rgba(17, 37, 69, 0.88);
            border: 1px solid rgba(125, 169, 230, 0.35);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);

            text-align: center;
        }

        h2 {
            color: white;
            font-size: 29px;
            margin: 0 0 15px;
        }

        .descripcion {
            color: #e2e8f0;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        input {
            display: block;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;

            border: 1px solid #9daabe;
            border-radius: 10px;
            background: rgba(12, 27, 51, 0.9);
            color: white;
            font-size: 15px;
        }

        input::placeholder {
            color: #d5dbe5;
        }

        input:focus {
            outline: 2px solid #7ba8ed;
            border-color: #7ba8ed;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 5px;

            background: #1d3e6b;
            color: white;
            border: 1px solid #4075b7;
            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #285487;
        }

        .error {
            color: #fff;
            background: rgba(185, 28, 28, 0.85);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .volver {
            display: inline-block;
            margin-top: 23px;
            color: #a9cbff;
            font-size: 14px;
            font-weight: bold;
            text-decoration: underline;
        }

        .volver:hover {
            color: white;
        }

        @media (max-width: 600px) {
            .contenedor {
                padding: 28px 20px;
            }

            h2 {
                font-size: 25px;
            }

            .descripcion {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="pagina">
        <div class="contenedor">

            <h2>Crear nueva contraseña</h2>

            <p class="descripcion">
                Ingresa tu nueva contraseña para recuperar
                el acceso a tu cuenta.
            </p>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <form method="POST">
                <input
                    type="password"
                    name="contrasena"
                    placeholder="Nueva contraseña"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <input
                    type="password"
                    name="confirmar_contrasena"
                    placeholder="Confirmar contraseña"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="submit">
                    Guardar nueva contraseña
                </button>
            </form>

            <a class="volver" href="{{ url_for('login') }}">
                Volver al inicio de sesión
            </a>

        </div>
    </main>
</body>
</html>

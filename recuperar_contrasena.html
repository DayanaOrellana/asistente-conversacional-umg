
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | Asistente UMG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;

            background:
                linear-gradient(
                    rgba(9, 18, 35, 0.62),
                    rgba(9, 18, 35, 0.78)
                ),
                url("{{ url_for('static', filename='campus_jutiapa.webp') }}")
                center center / cover no-repeat fixed;
        }

        .pagina-recuperacion {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 20px;
        }

        .contenido {
            width: 100%;
            max-width: 520px;
        }

        h1 {
            font-size: 34px;
            text-align: center;
            margin: 0 0 12px;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .subtitulo {
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 28px;
            color: #f1f5f9;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            margin-bottom: 16px;

            border: 1px solid #9daabe;
            border-radius: 10px;

            background: rgba(17, 31, 56, 0.88);
            color: white;
            font-size: 15px;
        }

        input::placeholder {
            color: #d5dbe5;
        }

        input:focus {
            outline: 2px solid #7ba8ed;
            border-color: #7ba8ed;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 5px;

            background: #1d3e6b;
            color: white;

            border: 1px solid #4075b7;
            border-radius: 10px;

            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #285487;
        }

        .mensaje {
            background: rgba(23, 107, 58, 0.88);
            color: white;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .volver {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .volver a {
            color: #a9cbff;
            font-weight: bold;
            text-decoration: underline;
        }

        .volver a:hover {
            color: white;
        }

        @media (max-width: 600px) {
            .pagina-recuperacion {
                padding: 20px 15px;
            }

            h1 {
                font-size: 27px;
            }

            .subtitulo {
                font-size: 14px;
            }

            label {
                font-size: 14px;
            }

            input {
                padding: 12px 14px;
                font-size: 14px;
            }

            button {
                padding: 13px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="pagina-recuperacion">

        <div class="contenido">

            <h1>Recuperar contraseña</h1>

            <p class="subtitulo">
                Asistente Conversacional UMG
                <br>
                Ingresa tu correo electrónico para recibir
                un enlace de recuperación.
            </p>

            {% if mensaje %}
                <div class="mensaje">
                    {{ mensaje }}
                </div>
            {% endif %}

            <form method="POST">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingresa tu correo electrónico"
                    autocomplete="email"
                    required
                >

                <button type="submit">
                    Enviar enlace de recuperación
                </button>

            </form>

            <p class="volver">
                ¿Recordaste tu contraseña?
                <a href="{{ url_for('login') }}">
                    Volver al inicio de sesión
                </a>
            </p>

        </div>

    </main>

</body>
</html>


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario - UMG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                linear-gradient(
                    rgba(4, 17, 42, 0.75),
                    rgba(4, 17, 42, 0.85)
                ),
                url("{{ url_for('static', filename='2.webp') }}")
                center/cover fixed;

            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 25px;
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
            padding: 25px 28px;
            margin: 20px auto;
            background: rgba(9, 30, 65, 0.93);
            border: 1px solid #65b9ff;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin: 0 0 12px;
        }

        .descripcion {
            text-align: center;
            color: #cbdcf0;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 13px 0 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #7dbaff;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            color: #142b4d;
        }

        input:focus {
            outline: 2px solid #65b9ff;
        }

        .informacion {
            background: rgba(37, 132, 216, 0.15);
            border: 1px solid #375a83;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 13px;
            line-height: 1.7;
        }

        .error {
            background: rgba(180, 35, 45, 0.25);
            border: 1px solid #ff8b8b;
            color: #ffd1d1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .botones {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .boton {
            flex: 1;
            padding: 12px 8px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .guardar {
            background: #2584d8;
            color: white;
        }

        .guardar:hover {
            background: #1268b4;
        }

        .cancelar {
            background: #334e70;
            color: white;
        }

        .cancelar:hover {
            background: #466589;
        }

        .nota {
            text-align: center;
            color: #b9cde5;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 18px;
        }

        @media (max-width: 480px) {
            .botones {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Editar Usuario</h1>

        <p class="descripcion">
            Modifica la información básica del usuario
            registrado en el Asistente Conversacional UMG.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <div class="informacion">
            <strong>Rol:</strong> {{ usuario.rol }}<br>
            <strong>Estado:</strong> {{ usuario.estado }}
        </div>

        <form method="POST"
              action="{{ url_for('editar_usuario',
                                 id_usuario=usuario.id_usuario) }}">

            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                value="{{ usuario.nombre }}"
                maxlength="100"
                required
            >

            <label for="apellido">Apellido</label>
            <input
                type="text"
                id="apellido"
                name="apellido"
                value="{{ usuario.apellido }}"
                maxlength="100"
                required
            >

            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                name="correo"
                value="{{ usuario.correo }}"
                maxlength="150"
                required
            >

            <div class="botones">

                <button type="submit" class="boton guardar">
                    Guardar cambios
                </button>

                <a href="{{ url_for('administrar_usuarios') }}"
                   class="boton cancelar">
                    Cancelar
                </a>

            </div>

        </form>

        <p class="nota">
            La edición no modifica la contraseña,
            el rol ni el historial de conversaciones.
        </p>

    </div>

</body>
</html>


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña | Asistente UMG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
            max-width: 85%;
            text-align: center;
        }

        h2 {
            color: #243b70;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
            border-radius: 6px;
        }

        input {
            border: 1px solid #ccc;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 10px;
            border-radius: 6px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Crear nueva contraseña</h2>

        <p>Ingresa tu nueva contraseña para recuperar el acceso a tu cuenta.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input
                type="password"
                name="contrasena"
                placeholder="Nueva contraseña"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <input
                type="password"
                name="confirmar_contrasena"
                placeholder="Confirmar contraseña"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button type="submit">Guardar nueva contraseña</button>
        </form>

        <a href="{{ url_for('login') }}">Volver al inicio de sesión</a>
    </div>
</body>
</html>

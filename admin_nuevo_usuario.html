
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Administrador - UMG</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                linear-gradient(
                    rgba(4, 17, 42, 0.75),
                    rgba(4, 17, 42, 0.85)
                ),
                url("{{ url_for('static', filename='2.webp') }}")
                center/cover fixed;

            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 25px 35px;
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
            padding: 22px 28px;
            margin: 20px auto;
            background: rgba(9, 30, 65, 0.93);
            border: 1px solid #65b9ff;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 28px;
        }

        .descripcion {
            color: #cbdcf0;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #7dbaff;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            color: #142b4d;
        }

        input:focus {
            outline: 2px solid #65b9ff;
        }

        .error {
            background: rgba(180, 35, 45, 0.25);
            border: 1px solid #ff8b8b;
            color: #ffd1d1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
        }

        .botones {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        .boton {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .guardar {
            background: #2584d8;
            color: white;
        }

        .guardar:hover {
            background: #1268b4;
        }

        .cancelar {
            background: #334e70;
            color: white;
        }

        .cancelar:hover {
            background: #466589;
        }

        .nota {
            margin-top: 20px;
            font-size: 13px;
            color: #b9cde5;
            text-align: center;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .botones {
                flex-direction: column;
            }
        }

                /* Formulario más compacto */
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .descripcion {
            font-size: 14px;
            margin-bottom: 15px;
        }

        label {
            font-size: 14px;
            margin: 10px 0 5px;
        }

        input {
            padding: 9px 12px;
            font-size: 14px;
        }

        .botones {
            margin-top: 20px;
            gap: 10px;
        }

        .boton {
            padding: 11px 8px;
            font-size: 13px;
        }

        .nota {
            font-size: 12px;
            margin-top: 15px;
        }

    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Registrar Administrador</h1>

        <p class="descripcion">
            Registra una nueva cuenta administrativa
            para el Asistente Conversacional UMG.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST"
              action="{{ url_for('registrar_administrador') }}">

            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                maxlength="100"
                autocomplete="given-name"
                required
            >

            <label for="apellido">Apellido</label>
            <input
                type="text"
                id="apellido"
                name="apellido"
                maxlength="100"
                autocomplete="family-name"
                required
            >

            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                name="correo"
                maxlength="150"
                autocomplete="off"
                required
            >

            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                name="contrasena"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <div class="botones">

                <button type="submit" class="boton guardar">
                    Registrar administrador
                </button>

                <a href="{{ url_for('administrar_usuarios') }}"
                   class="boton cancelar">
                    Cancelar
                </a>

            </div>

        </form>

        <p class="nota">
            Solo los administradores autorizados pueden
            registrar nuevas cuentas administrativas.
            Las contraseñas se almacenan de forma protegida.
        </p>

    </div>

</body>
</html>
